name: dre-metal-probe

on:
  workflow_dispatch:
    inputs:
      compile_frontend:
        description: Optional standalone frontend compile; coordinated runtime workflow already builds matching objects
        type: boolean
        default: false
  push:
    branches: [dre-metal-build, dre-native-validation]
    paths:
      - 'devices/dre/gpu/**'
      - '!devices/dre/gpu/vulkan/**'
      - '!devices/dre/gpu/compiler/**'
      - '!devices/dre/gpu/android_probe/**'
      # Matching Rust/frontend/package work is owned by dre-ios-rust.
      # Keep only runtime C fixtures actually consumed by this workflow.
      - '!devices/dre/gpu/runtime/**'
      - 'devices/dre/gpu/runtime/*factory*'
      - 'devices/dre/gpu/runtime/compiler_request.*'
      - 'devices/dre/gpu/runtime/test_compiler_request.c'
      - 'devices/dre/touch_native/**'
      - 'devices/dre/touch/**'
      - 'devices/dre/libfdt/**'
      - 'devices/dre/storage_abi.*'
      - 'devices/dre/dma_memory.*'
      - 'tools/check-dre-gpu-host.py'
      - 'tools/test-dre-c-linkage.py'
      - '.github/workflows/dre-metal-probe.yml'

concurrency:
  group: dre-metal-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select matching Xcode
        run: |
          test "$(uname -m)" = x86_64
          # Same real SDK as the coordinated runtime build. Sonoma runners
          # retired on Nov 2,2026; do not silently select a different Xcode.
          XC=/Applications/Xcode_16.4.app
          test -d "$XC/Contents/Developer"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version | tee xcode-version.log
          grep -Fx 'Xcode 16.4' xcode-version.log
          grep -Fx 'Build version 16F6' xcode-version.log
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 18.5
      - name: Compile actual iOS Metal workload and Adreno primitives
        run: |
          bash devices/dre/gpu/build_metal_probe.sh out/dre-metal-probe
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          for SOURCE in devices/dre/gpu/a619_*.c devices/dre/gpu/platform/*.c; do
            case $(basename "$SOURCE") in test_*) continue ;; esac
            NAME=$(basename "$SOURCE" .c)
            xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -isysroot "$SDK" \
              -Idevices/dre/libfdt \
              -ffreestanding -fno-builtin -mgeneral-regs-only -mstrict-align \
              -O2 -Wall -Wextra -Werror -c "$SOURCE" \
              -o "out/dre-metal-probe/$NAME.o"
          done
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -std=c11 -O2 -Wall -Wextra -Werror -c devices/dre/gpu/runtime/compiler_request.c \
            -o out/dre-metal-probe/compiler_request.o
      - name: Run production host fixtures
        run: |
          python3 tools/check-dre-gpu-host.py --cc clang --out out/gpu-host-tests
          python3 devices/dre/test_firmware_handoff.py
          python3 tools/test-dre-c-linkage.py --cc clang --cxx clang++ --out out/c-cpp-linkage
      - name: Run native touch protocol and lifetime fixtures
        if: ${{ !cancelled() }}
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          python3 devices/dre/touch_native/test_native.py --cc clang --sanitize \
            --crypto-library "$(brew --prefix openssl@3)/lib/libcrypto.dylib" \
            --out out/touch-host-tests
      - name: Link read-only factory observer against official iPhoneOS SDK
        if: ${{ !cancelled() }}
        run: bash devices/dre/gpu/runtime/build_factory_probe.sh out/dre-metal-factory
      - name: Compile adapted Metal306 frontend translation units
        if: ${{ inputs.compile_frontend == true }}
        run: python3 devices/dre/gpu/runtime/build_frontend.py --out out/metal306-frontend --dre-compiler-service --dre-device-policy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dre-metal-probe
          path: |
            out/dre-metal-probe/
            out/dre-metal-factory/
            out/gpu-host-tests/
            out/c-cpp-linkage/
            out/touch-host-tests/
            out/metal306-frontend/*.json
            out/metal306-frontend/*.log
            out/metal306-frontend/objects/
          if-no-files-found: error
