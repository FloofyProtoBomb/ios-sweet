name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      dre_profile:
        description: DRE bringup or UI/SMP kernel patch profile
        type: choice
        options: [bringup, ui]
        default: bringup
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main, dre-n200, dre-ui, dre-storage]
    paths:
      - "xnu/patches/**"
      - "devices/dre/**/*.c"
      - "devices/dre/**/*.h"
      - "devices/dre/**/*.S"
      - "devices/dre/**/*.patch"
      - "devices/dre/stage_xnu.py"
      - "tools/enable-xnu-ccache.py"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || (startsWith(github.ref_name, 'dre-') && 'DRE') || 'SWEET' }}
  DRE_PROFILE: ${{ inputs.dre_profile || ((github.ref_name == 'dre-ui' || github.ref_name == 'dre-storage') && 'ui') || 'bringup' }}

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          if [ "$MACHINE_CONFIG" = DRE ]; then
            python3 devices/dre/stage_xnu.py dxb/patches --profile "$DRE_PROFILE"
            cp tools/enable-xnu-ccache.py dxb/enable-xnu-ccache.py
            # build.sh invokes patch scripts from dxb/xnu before compiling.
            printf 'python3 ../enable-xnu-ccache.py makedefs/MakeInc.cmd\n' > dxb/patches/9999-compiler-cache.sh
          else
            cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          fi
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          echo "DRE_CCACHE=$(command -v ccache)" >> "$GITHUB_ENV"
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Identify compiler cache
        if: env.MACHINE_CONFIG == 'DRE'
        id: compiler-cache
        run: |
          ID=$({ xcodebuild -version; xcrun clang --version; xcrun --sdk macosx --show-sdk-build-version; } | shasum -a 256 | cut -d ' ' -f1)
          echo "toolchain=$ID" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: env.MACHINE_CONFIG == 'DRE'
        with:
          path: ${{ runner.temp }}/ios-sweet-ccache
          key: ccache-v1-${{ runner.os }}-${{ steps.compiler-cache.outputs.toolchain }}-${{ env.DXB_SHA }}-${{ env.MACOS_VERSION }}-${{ env.MACHINE_CONFIG }}-${{ env.DRE_PROFILE }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ steps.compiler-cache.outputs.toolchain }}-${{ env.DXB_SHA }}-${{ env.MACOS_VERSION }}-${{ env.MACHINE_CONFIG }}-${{ env.DRE_PROFILE }}-

      - name: Build
        working-directory: dxb
        env:
          CCACHE_DIR: ${{ runner.temp }}/ios-sweet-ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 1G
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log

      - name: Compiler cache statistics
        if: always() && env.MACHINE_CONFIG == 'DRE'
        env:
          CCACHE_DIR: ${{ runner.temp }}/ios-sweet-ccache
        run: ccache --show-stats

      - name: Verify DRE patch application
        if: always() && env.MACHINE_CONFIG == 'DRE'
        run: |
          python3 tools/verify-dre-patches.py dxb/patches/dre-patches.json dxb/build.log

      - name: Summarize build errors
        if: always()
        run: |
          mkdir -p out
          if [ -f dxb/build.log ]; then
            python3 tools/summarize-xnu-build.py dxb/build.log out/build-errors.txt
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-build-log
          path: dxb/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          if [ "$MACHINE_CONFIG" = DRE ]; then
            test -s "out/kernel.$(echo "$KERNEL_CONFIG" | tr A-Z a-z).dre"
          fi
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
